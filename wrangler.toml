name = "sveltia-cms-auth"
main = "src/index.js"
compatibility_date = "2023-03-24"
workers_dev = true

# Keep variables set in the Cloudflare dashboard (GITHUB_CLIENT_ID,
# ALLOWED_DOMAINS) when deploying. Without this, `wrangler deploy` replaces
# them with this file's [vars], which is how ALLOWED_DOMAINS was emptied on
# 2026-09-13. An empty ALLOWED_DOMAINS turns this worker into an open OAuth
# proxy: any site can open the login popup and receive a GitHub token.
keep_vars = true

# ALLOWED_DOMAINS is not a secret. Set it in the dashboard to:
#   erikhehrmann.com, *.erikhehrmann.com
# GITHUB_CLIENT_SECRET stays a secret: `wrangler secret put GITHUB_CLIENT_SECRET`.
